<section class="locations container">
  <ul class="locations__list tabs__list">
    @for (citiName of cities; track $index) {
      <li class="locations__item">
        <a class="locations__item-link tabs__item" href="#" (click)="setCity()">
          <span>{{ citiName }}</span>
        </a>
      </li>
    }
  </ul>
</section>
