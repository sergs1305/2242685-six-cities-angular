<div [class]="placesListClass">

  @for (offer of cityOffers; track $index) {
    <app-place-card [offer]="offer" [placesListPageName]="placesListPageName" (offerId)="setActiveCardOfferId($event)"></app-place-card>
  } @empty { <!-- поправить разметку -->
    <b class="cities__status">No places to stay available</b>
    <p class="cities__status-description">We could not find any property available at the moment in {{ currentCityName }}</p> <!-- наименование города!!! -->
  }

</div>
